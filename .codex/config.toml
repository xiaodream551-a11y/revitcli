# RevitCli Codex agent registry.
#
# This project uses human-led Codex work with a few bounded helper agents.
# There is no autonomous tick loop, no automatic commit path, and no hidden
# agent runtime. The top-level Codex session owns planning, integration, and
# final verification. See .codex/CONTRACT.md.

default_agent = "repo-explorer"

[agents.repo-explorer]
description = "Read-only lookup agent for files, symbols, call chains, tests, and impact scope."
config_file = "agents/repo-explorer.toml"

[agents.cli-engineer]
description = "Implementation agent for scoped CLI, shared-contract, profile, output, plan, receipt, workflow, and dashboard support work."
config_file = "agents/cli-engineer.toml"

[agents.addin-engineer]
description = "Implementation agent for scoped Revit add-in, HTTP handler, bridge, service, reload, installer, and Windows/Revit validation work."
config_file = "agents/addin-engineer.toml"

[agents.test-engineer]
description = "Testing agent for scoped xUnit, fixtures, verification diagnosis, and regression coverage."
config_file = "agents/test-engineer.toml"

[agents.code-reviewer]
description = "Read-only review agent for one diff, one commit, or one explicitly named path set."
config_file = "agents/code-reviewer.toml"
